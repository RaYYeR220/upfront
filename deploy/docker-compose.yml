services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    volumes:
      - upfront-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_HOST=${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  upfront-data:
  caddy-data:
  caddy-config:
